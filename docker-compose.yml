
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfiles/Dockerfile.backend
    container_name: backend
    restart: always  
    env_file:
      - ./backend/.env
    depends_on:
      - mongo
    networks:
      - app_network
  frontend:
    build:
      context: .
      dockerfile: Dockerfiles/Dockerfile.frontend 
    container_name: frontend
    restart: always 
    networks:
      - app_network

  mongo:
    image: mongo:latest
    container_name: mongo
    restart: always
    expose:
      - "27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - app_network
  nginx:
    image: nginx:latest
    container_name: nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - frontend
      - backend
    networks:
      - app_network
volumes:
  mongo-data:
networks:
  app_network:
    driver: bridge